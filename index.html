<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IA - Unix</title>
<style>
  :root {
    --bg-main: #09090b;
    --bg-elevated: #111114;
    --bg-surface: #18181b;
    --bg-surface-hover: #222226;
    --border-subtle: #27272a;
    --border-focus: #6366f1;
    --text-primary: #fafafa;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --accent-primary: #6366f1;
    --accent-secondary: #8b5cf6;
    --accent-glow: rgba(99, 102, 241, 0.16);
  }

  /* Colores guardados del botón buscar para usar en otro momento:
     background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
     color: #ffffff;
     box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
  */
  .saved-send-colors {
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    color: #ffffff;
    box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  header {
    height: 56px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid var(--border-subtle);
    background: rgba(9, 9, 11, 0.85);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-logo {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .brand-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    min-width: 0;
  }

  .brand-title {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .model-pill {
    font-size: 11px;
    font-weight: 500;
    color: #c7d2fe;
    background: var(--accent-glow);
    border: 1px solid rgba(99, 102, 241, 0.35);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .btn-new {
    background: transparent;
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    outline: none;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .btn-new:hover,
  .btn-new:active,
  .btn-new:focus {
    background: transparent;
    color: var(--text-secondary);
    border-color: var(--border-subtle);
  }

  #chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 16px;
    scroll-behavior: smooth;
  }

  #chat-scroll::-webkit-scrollbar {
    width: 6px;
  }

  #chat-scroll::-webkit-scrollbar-thumb {
    background: #27272a;
    border-radius: 999px;
  }

  .chat-container {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Asistente animado a la derecha, debajo de la línea y antes del título */
  .assistant-bar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  .assistant-widget {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    max-width: 100%;
  }

  .assistant-bubble {
    max-width: 320px;
    background: var(--bg-elevated);
    border: 1px solid rgba(99, 102, 241, 0.35);
    color: #e4e4e7;
    font-size: 12px;
    line-height: 1.35;
    padding: 6px 11px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    transition: border-color 0.2s ease;
  }

  .assistant-bubble.message-anim {
    border-color: var(--accent-primary);
    animation: bubblePop 0.48s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes bubblePop {
    0% {
      opacity: 0.35;
      transform: translateY(5px) scale(0.95);
    }
    55% {
      opacity: 1;
      transform: translateY(-2px) scale(1.03);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .assistant-avatar-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    padding: 0;
    border: 1px solid rgba(99, 102, 241, 0.55);
    background: var(--bg-elevated);
    cursor: pointer;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 2px var(--accent-glow);
    animation: assistantFloat 2.6s ease-in-out infinite;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .assistant-avatar-btn:hover {
    transform: scale(1.06);
    border-color: #a5b4fc;
  }

  .assistant-avatar-btn.speaking-anim {
    animation: assistantTalk 0.55s ease-in-out;
    border-color: #c4b5fd;
  }

  .assistant-avatar-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes assistantFloat {
    0%, 100% {
      transform: translateY(0px);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.16);
    }
    50% {
      transform: translateY(-2.5px);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.24);
    }
  }

  @keyframes assistantTalk {
    0% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.12) rotate(-7deg); }
    55% { transform: scale(0.96) rotate(7deg); }
    80% { transform: scale(1.06) rotate(-3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  #welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px 12px 20px;
    gap: 14px;
  }

  #welcome-heading {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  #welcome-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    max-width: 460px;
    line-height: 1.5;
  }

  .suggestions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 10px;
    width: 100%;
    margin-top: 12px;
  }

  .suggestion-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 12px 14px;
    text-align: left;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .suggestion-card strong {
    display: block;
    color: var(--text-primary);
    font-size: 13px;
    margin-bottom: 3px;
  }

  .suggestion-card:hover {
    background: var(--bg-surface);
    border-color: rgba(99, 102, 241, 0.45);
    transform: translateY(-1px);
  }

  /* Opciones de Plantilla y fotos de liquidación */
  .liquidacion-panel {
    display: none;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-top: 12px;
  }

  .ot-box {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
  }

  .ot-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
  }

  .ot-input {
    flex: 1;
    min-width: 0;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .ot-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .ot-input::placeholder {
    color: var(--text-muted);
  }

  .ot-search-btn {
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    color: #ffffff;
    box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .ot-search-btn:hover {
    filter: brightness(1.1);
    transform: scale(1.03);
  }

  .msg-row {
    display: flex;
    width: 100%;
    gap: 12px;
    animation: fadeIn 0.18s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user {
    justify-content: flex-end;
  }

  .msg-row.bot {
    justify-content: flex-start;
    align-items: flex-start;
  }

  .msg-content-wrap {
    max-width: 85%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .msg-row.user .msg-bubble {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    padding: 11px 16px;
    border-radius: 18px 18px 4px 18px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-row.bot .msg-bubble {
    background: transparent;
    color: var(--text-primary);
    padding: 2px 0;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }

  .action-btn {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }

  .action-btn:hover {
    background: var(--bg-surface);
    color: var(--text-primary);
    border-color: #3f3f46;
  }

  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 8px 0;
    color: var(--text-secondary);
    font-size: 13.5px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-primary);
    animation: pulse 1.2s infinite ease-in-out;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  .composer-area {
    padding: 10px 16px 16px;
    background: linear-gradient(to top, var(--bg-main) 75%, transparent);
    flex-shrink: 0;
  }

  .composer-stack {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Aviso de texto en amarillo bajo */
  .prompt-hint {
    display: none;
    background: rgba(234, 179, 8, 0.08);
    border: 1px solid rgba(234, 179, 8, 0.24);
    color: #fde68a;
    font-size: 12.5px;
    line-height: 1.4;
    padding: 8px 12px;
    border-radius: 12px;
  }

  /* Aviso de audio bloqueado en rojo bajo */
  .audio-blocked-notice {
    display: none;
    background: rgba(239, 68, 68, 0.08);
    border: 1px solid rgba(239, 68, 68, 0.24);
    color: #fca5a5;
    font-size: 11.5px;
    line-height: 1.35;
    padding: 6px 12px;
    border-radius: 10px;
  }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  @media (max-width: 640px) {
    header {
      padding: 0 10px;
      gap: 6px;
    }
    .brand {
      gap: 7px;
    }
    .brand-info {
      gap: 5px;
    }
    .brand-title {
      font-size: 12px;
    }
    .model-pill {
      font-size: 10px;
      padding: 2px 6px;
    }
    .btn-new {
      font-size: 11px;
      padding: 5px 8px;
    }
    .assistant-bubble {
      max-width: 210px;
      font-size: 11.5px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo"><img src="logo.jpg" alt="UNIX Logo"></div>
    <div class="brand-info">
      <span class="brand-title">IA - Unix</span>
      <span class="model-pill">OpenRouter • Supabase</span>
    </div>
  </div>

  <button type="button" class="btn-new" onclick="limpiarChat()" title="Nueva consulta">
    <span><-</span> Página principal
  </button>
</header>

<div id="chat-scroll">
  <div class="chat-container" id="chat">
    <div class="assistant-bar">
      <div class="assistant-widget" id="assistant-widget">
        <div id="assistant-bubble" class="assistant-bubble">Listo para ayudarte</div>
        <button id="assistant-avatar-btn" type="button" class="assistant-avatar-btn" onclick="accionAleatoriaAsistente()" title="Asistente">
          <img src="asistente.png" alt="Asistente">
        </button>
      </div>
    </div>

    <div id="welcome-screen">
      <h1 id="welcome-heading">¿En qué te ayudo?</h1>
      <p id="welcome-subtitle">Selecciona, escribe o envíame un audio</p>
      <div id="suggestions-grid" class="suggestions">
        <button type="button" class="suggestion-card" onclick="prepararBoton('carga')">
          <strong>Carga de POS</strong>
          Escríbeme: "Carga " + Comercio + Modelo POS
        </button>
        <button type="button" class="suggestion-card" onclick="abrirOpcionesPlantilla()">
          <strong>Plantilla y fotos de liquidación</strong>
          Elige una opción de liquidación
        </button>
        <button type="button" class="suggestion-card" onclick="prepararBoton('release')">
          <strong>Reléase actual</strong>
          Escríbeme: "Reléase " + Comercio
        </button>
        <button type="button" class="suggestion-card" onclick="prepararBoton('problema')">
          <strong>Problema en un POS</strong>
          Escríbeme: "Problema" + Falla del POS
        </button>
        <button type="button" class="suggestion-card" onclick="prepararBoton('guia')">
          <strong>Guía de configuración</strong>
          Escríbeme: "Guia " + Comercio + Modelo POS
        </button>
      </div>

      <div id="liquidacion-panel" class="liquidacion-panel">
        <button type="button" class="suggestion-card" onclick="seleccionarContometro()">
          <strong>Para liquidación de Contómetro</strong>
        </button>
        <div id="ot-box" class="ot-box">
          <label for="ot-input" class="ot-label">Según número de OT:</label>
          <input id="ot-input" type="text" class="ot-input" placeholder="Ingresa el número de OT" oninput="actualizarMensajePorOT(this.value)">
        </div>
      </div>
    </div>
  </div>
</div>

<div class="composer-area">
  <div class="composer-stack">
    <div id="audio-blocked-notice" class="audio-blocked-notice">
      El navegador bloqueó o no pudo reproducir el audio automáticamente.
    </div>
    <div id="prompt-hint" class="prompt-hint"></div>
  </div>
  <div class="footer-note">Respuestas basadas en la base de soluciones Supabase</div>
</div>

<script>
const SUPABASE_URL = "https://nlynbrrrybgufwmcjhmu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JtRhd51yYCWEEfHCs50Cjw_RSS-_kAu";

const TEXTO_BUSCANDO = "un momento";
const TITULO_INICIAL = "¿En qué te ayudo?";
const SUBTITULO_INICIAL = "Selecciona, escribe o envíame un audio";
const TITULO_PLANTILLAS = "Plantillas y Fotos";

// Mensajes personalizados del asistente
const MENSAJES_ASISTENTE = {
  inicio: "Listo para ayudarte",
  plantilla: "Elige una opción para buscar la info",
  contometro: "Revisa los datos para liquidación de Contómetro",
  ot: "Escribe el número de OT para continuar",
  carga: "Indica el comercio o modelo de POS para la carga",
  release: "Indica el comercio para revisar su Reléase",
  problema: "Describe la falla o error que presenta el POS",
  guia: "Indica el comercio o modelo de POS para la guía",
  buscando: "Buscando la información solicitada",
  respuesta: "Consulta completada"
};

// Saludos sin franja horaria (aparecen muy aleatoriamente al pulsar el asistente)
const SALUDOS_ALEATORIOS = [
  "¡Hola! ¿Qué tal?",
  "¡Hey! ¿Todo bien por ahí?",
  "¡Qué tal! Por aquí ando.",
  "¡Hola! ¿Cómo va todo?"
];

const AVISOS_ALEATORIOS = [
  "Aquí estoy si necesitas revisar algo.",
  "Cuando quieras, elige una opción.",
  "Todo listo para continuar.",
  "¿Revisamos alguna OT o guía?"
];

const PROBABILIDAD_SALUDO = 0.22;

const chat = document.getElementById('chat');
const chatScroll = document.getElementById('chat-scroll');
const promptHint = document.getElementById('prompt-hint');
const audioBlockedNotice = document.getElementById('audio-blocked-notice');
const suggestionsGrid = document.getElementById('suggestions-grid');
const liquidacionPanel = document.getElementById('liquidacion-panel');
const otBox = document.getElementById('ot-box');
const welcomeHeading = document.getElementById('welcome-heading');
const welcomeSubtitle = document.getElementById('welcome-subtitle');
const assistantBubble = document.getElementById('assistant-bubble');
const assistantAvatarBtn = document.getElementById('assistant-avatar-btn');

let audioCheckTimer = null;
let ultimoMensajeAleatorio = "";

const ACCIONES_BOTONES = {
  carga: {
    texto: "Carga ",
    aviso: "Ejemplo: Carga A910 Ripley",
    mensajeAsistente: MENSAJES_ASISTENTE.carga
  },
  release: {
    texto: "Reléase ",
    aviso: "Ejemplo: Versión Lane7000 Saga",
    mensajeAsistente: MENSAJES_ASISTENTE.release
  },
  problema: {
    texto: "Problema ",
    aviso: "Ejemplo: Problema Código 89",
    mensajeAsistente: MENSAJES_ASISTENTE.problema
  },
  guia: {
    texto: "Guia ",
    aviso: "Guía Aruma P10",
    mensajeAsistente: MENSAJES_ASISTENTE.guia
  }
};

function setMensajeAsistente(texto) {
  if (!assistantBubble) return;
  assistantBubble.textContent = texto;

  assistantBubble.classList.remove("message-anim");
  void assistantBubble.offsetWidth;
  assistantBubble.classList.add("message-anim");

  if (assistantAvatarBtn) {
    assistantAvatarBtn.classList.remove("speaking-anim");
    void assistantAvatarBtn.offsetWidth;
    assistantAvatarBtn.classList.add("speaking-anim");
  }
}

function elegirSinRepetir(lista) {
  if (!lista.length) return "";
  if (lista.length === 1) return lista[0];
  const candidatas = lista.filter(item => item !== ultimoMensajeAleatorio);
  const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
  ultimoMensajeAleatorio = elegida;
  return elegida;
}

function accionAleatoriaAsistente() {
  const debeSaludar = Math.random() < PROBABILIDAD_SALUDO;
  const mensaje = debeSaludar
    ? elegirSinRepetir(SALUDOS_ALEATORIOS)
    : elegirSinRepetir(AVISOS_ALEATORIOS);
  setMensajeAsistente(mensaje);
}

function asegurarBotonFlechaOT() {
  if (!otBox || document.getElementById('ot-search-btn')) return;
  const btnFlecha = document.createElement('button');
  btnFlecha.id = 'ot-search-btn';
  btnFlecha.type = 'button';
  btnFlecha.className = 'ot-search-btn';
  btnFlecha.title = 'Buscar por número de OT';
  btnFlecha.setAttribute('aria-label', 'Buscar por número de OT');
  btnFlecha.textContent = '→';
  btnFlecha.onclick = buscarPorOT;
  otBox.appendChild(btnFlecha);
}

function buscarPorOT() {
  const otInput = document.getElementById('ot-input');
  const valorOT = otInput ? otInput.value.trim() : "";
  ocultarAvisoIndicacion();
  ocultarAvisoAudioBloqueado();
  hablarUnMomento();

  if (!valorOT) {
    setMensajeAsistente(MENSAJES_ASISTENTE.ot);
    if (otInput) otInput.focus();
    return;
  }

  setMensajeAsistente(`Buscando OT ${valorOT}`);
}

function mostrarAvisoAudioBloqueado(mensaje = "El navegador bloqueó o no pudo reproducir el audio automáticamente.") {
  audioBlockedNotice.textContent = mensaje;
  audioBlockedNotice.style.display = "block";
}

function ocultarAvisoAudioBloqueado() {
  audioBlockedNotice.style.display = "none";
}

function mostrarAvisoIndicacion(textoAviso) {
  promptHint.textContent = textoAviso;
  promptHint.style.display = "block";
}

function ocultarAvisoIndicacion() {
  promptHint.style.display = "none";
  promptHint.textContent = "";
}

function mostrarSugerenciasPrincipales() {
  if (welcomeHeading) welcomeHeading.textContent = TITULO_INICIAL;
  if (welcomeSubtitle) {
    welcomeSubtitle.textContent = SUBTITULO_INICIAL;
    welcomeSubtitle.style.display = "block";
  }
  if (suggestionsGrid) {
    suggestionsGrid.style.display = "grid";
  }
  if (liquidacionPanel) {
    liquidacionPanel.style.display = "none";
  }
}

function abrirOpcionesPlantilla() {
  if (welcomeHeading) welcomeHeading.textContent = TITULO_PLANTILLAS;
  if (welcomeSubtitle) welcomeSubtitle.style.display = "none";
  if (suggestionsGrid) suggestionsGrid.style.display = "none";
  if (liquidacionPanel) liquidacionPanel.style.display = "flex";

  asegurarBotonFlechaOT();

  const otInput = document.getElementById('ot-input');
  if (otInput) otInput.focus();

  setMensajeAsistente(MENSAJES_ASISTENTE.plantilla);
}

function seleccionarContometro() {
  const otInput = document.getElementById('ot-input');
  if (otInput) otInput.focus();
  setMensajeAsistente(MENSAJES_ASISTENTE.contometro);
}

function actualizarMensajePorOT(valor) {
  const limpio = String(valor || "").trim();
  if (limpio) {
    setMensajeAsistente(`OT ingresada: ${limpio}`);
  } else {
    setMensajeAsistente(MENSAJES_ASISTENTE.ot);
  }
}

function ocultarBienvenida() {
  const welcome = document.getElementById('welcome-screen');
  if (welcome) welcome.style.display = 'none';
}

function limpiarChat() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
  clearTimeout(audioCheckTimer);
  ocultarAvisoIndicacion();
  ocultarAvisoAudioBloqueado();
  mostrarSugerenciasPrincipales();

  const otInput = document.getElementById('ot-input');
  if (otInput) otInput.value = "";

  const filas = chat.querySelectorAll('.msg-row');
  filas.forEach(f => f.remove());
  const welcome = document.getElementById('welcome-screen');
  if (welcome) welcome.style.display = 'flex';

  setMensajeAsistente(MENSAJES_ASISTENTE.inicio);
}

function prepararBoton(clave) {
  const config = ACCIONES_BOTONES[clave];
  if (!config) return;

  mostrarSugerenciasPrincipales();

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
  clearTimeout(audioCheckTimer);
  ocultarAvisoAudioBloqueado();

  mostrarAvisoIndicacion(config.aviso);
  setMensajeAsistente(config.mensajeAsistente);
}

function agregar(texto, tipo) {
  ocultarBienvenida();

  const row = document.createElement('div');
  row.className = 'msg-row ' + tipo;

  const wrap = document.createElement('div');
  wrap.className = 'msg-content-wrap';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = texto;
  wrap.appendChild(bubble);

  if (tipo === 'bot') {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const btnCopiar = document.createElement('button');
    btnCopiar.type = 'button';
    btnCopiar.className = 'action-btn';
    btnCopiar.textContent = '📋 Copiar';
    btnCopiar.onclick = () => {
      navigator.clipboard.writeText(texto);
      btnCopiar.textContent = '✓ Copiado';
      setTimeout(() => btnCopiar.textContent = '📋 Copiar', 1500);
    };

    actions.appendChild(btnCopiar);
    wrap.appendChild(actions);

    setMensajeAsistente(MENSAJES_ASISTENTE.respuesta);
  }

  row.appendChild(wrap);
  chat.appendChild(row);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  return row;
}

function hablarUnMomento() {
  clearTimeout(audioCheckTimer);
  ocultarAvisoAudioBloqueado();

  if (!("speechSynthesis" in window)) {
    mostrarAvisoAudioBloqueado("Este navegador no soporta reproducción de audio.");
    return;
  }

  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(TEXTO_BUSCANDO);
  u.lang = 'es-PE';
  u.rate = 1;

  let inicioDetectado = false;

  u.onstart = () => {
    inicioDetectado = true;
    ocultarAvisoAudioBloqueado();
  };

  u.onerror = (e) => {
    if (!inicioDetectado) {
      const detalle = e?.error ? ` (${e.error})` : "";
      mostrarAvisoAudioBloqueado(`Audio bloqueado o no disponible${detalle}.`);
    }
  };

  try {
    speechSynthesis.speak(u);
  } catch (err) {
    mostrarAvisoAudioBloqueado("El navegador bloqueó la reproducción de audio.");
    return;
  }

  audioCheckTimer = setTimeout(() => {
    if (!inicioDetectado && !speechSynthesis.speaking && !speechSynthesis.pending) {
      mostrarAvisoAudioBloqueado("El navegador bloqueó o detuvo la reproducción de audio.");
    }
  }, 450);
}

window.addEventListener("DOMContentLoaded", () => {
  setMensajeAsistente(MENSAJES_ASISTENTE.inicio);
});
</script>
</body>
</html>
